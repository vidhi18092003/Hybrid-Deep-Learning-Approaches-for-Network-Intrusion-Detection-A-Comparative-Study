[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-intrusion-detection-stream"
version = "1.0.0"
description = "Adapted Anomaly Detection in Big Data Streams using Hybrid ML Models"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "University Minor Project Group", email = "student@university.edu" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "pyarrow>=5.0.0",
    "scikit-learn>=1.0.0",
    "torch>=1.10.0",
    "streamlit>=1.0.0",
    "pyyaml>=5.4.0",
    "kafka-python-ng>=2.2.0",
    "watchdog>=2.1.0",
    "pytest>=6.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "pyspark>=3.2.0"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
